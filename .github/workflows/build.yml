      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk launcher.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Launcher v${{ github.run_number }}
          body: Versión visible en la app (panel de control, abajo) - v${{ github.run_number }}
          files: launcher.apk
          make_latest: true
