# Compila tu launcher de TV como APK usando GitHub (gratis, sin PC).
# Cada vez que cambias index.html o este archivo, GitHub genera un APK nuevo.
name: Compilar launcher

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnóstico del index.html (muestra qué archivo hay en el repo)
        run: |
          echo "== Archivos en la raíz del repo =="
          ls -la
          echo "== Tamaño de index.html (el bueno pesa unos 540000 bytes) =="
          wc -c index.html
          echo "== Etiquetas script encontradas =="
          grep -o '<script[^>]*>' index.html || echo "NINGUNA"
          echo "== Primeros caracteres =="
          head -c 200 index.html; echo

      - name: Revisar que el JavaScript del launcher no tenga errores
        run: |
          cat > check.js <<'EOF_JS'
          const t = require('fs').readFileSync('index.html', 'utf8');
          const re = /<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g;
          let m, n = 0;
          while ((m = re.exec(t))) {
            if (!m[1].trim()) continue;
            n++;
            try { new Function(m[1]); } catch (e) { console.error('Error de sintaxis en el script ' + n + ':', e.message); process.exit(1); }
          }
          if (!n) { console.error('No encontré ningún <script> con código en index.html. Tamaño del archivo: ' + t.length + ' caracteres'); process.exit(1); }
          console.log('JavaScript OK (' + n + ' script)');
          EOF_JS
          node check.js
          rm check.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Marcar la versión dentro del launcher
        run: |
          ls -la *.html
          grep -q "__BUILD__" index.html || { echo "::error::El index.html de tu repo es la versión VIEJA. Sube el nuevo con el nombre exacto index.html (en la raíz)"; exit 1; }
          sed -i "s/__BUILD__/v$GITHUB_RUN_NUMBER-${GITHUB_SHA::7}/" index.html

      - name: Generar proyecto Android
        run: |
          set -e
          mkdir -p android/app/src/main/assets android/app/src/main/java/com/tvlauncher android/app/src/main/res/xml android/app/src/main/res/values
          cat > android/settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVLauncher"
          include ':app'
          EOF_FILE
          cat > android/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF_FILE
          cat > android/gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF_FILE
          cat > android/app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.tvlauncher'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.tvlauncher'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF_FILE
          cat > android/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:label="TV Launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:resumeWhilePausing="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode|screenLayout|smallestScreenSize|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <action android:name="android.intent.action.VOICE_COMMAND" />
                          <action android:name="android.intent.action.SEARCH_LONG_PRESS" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeyService"
                      android:exported="true"
                      android:label="TV Launcher botones"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/key_service" />
                  </service>

                  <service
                      android:name=".MediaListener"
                      android:exported="true"
                      android:label="TV Launcher música"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF_FILE
          cat > android/app/src/main/java/com/tvlauncher/MainActivity.kt <<'EOF_FILE'
          package com.tvlauncher

          import android.Manifest
          import android.app.Activity
          import android.app.ActivityManager
          import android.app.role.RoleManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.drawable.Drawable
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.net.ConnectivityManager
          import android.net.Uri
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.StatFs
          import android.os.SystemClock
          import android.provider.Settings
          import android.util.Base64
          import android.view.KeyEvent
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.util.Locale

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private var pendingAct: String? = null

              companion object {
                  @Volatile var keyMap: Map<Int, String> = HashMap()
                  @Volatile var learning = false
                  @Volatile var foreground = false
                  @Volatile var instance: MainActivity? = null

                  fun isNavKey(c: Int): Boolean = when (c) {
                      KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN, KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT,
                      KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_NUMPAD_ENTER,
                      KeyEvent.KEYCODE_BACK, KeyEvent.KEYCODE_ESCAPE, KeyEvent.KEYCODE_HOME, KeyEvent.KEYCODE_MENU,
                      KeyEvent.KEYCODE_POWER, KeyEvent.KEYCODE_TV_POWER,
                      KeyEvent.KEYCODE_VOLUME_UP, KeyEvent.KEYCODE_VOLUME_DOWN, KeyEvent.KEYCODE_VOLUME_MUTE -> true
                      else -> false
                  }

                  // botones del control que abren el panel o la búsqueda por voz de este launcher
                  fun actForKey(c: Int): String? = when (c) {
                      KeyEvent.KEYCODE_SETTINGS -> "panel"
                      KeyEvent.KEYCODE_ASSIST, KeyEvent.KEYCODE_VOICE_ASSIST, KeyEvent.KEYCODE_SEARCH -> "voice"
                      else -> null
                  }
              }

              fun fireAct(a: String) {
                  web.post { web.evaluateJavascript("window.onAct&&window.onAct('" + a + "')", null) }
              }

              fun learnHit(code: Int) {
                  learning = false
                  web.post { web.evaluateJavascript("window.onLearn&&window.onLearn(" + code + ")", null) }
              }

              private fun actFrom(i: Intent?): String? {
                  if (i == null) return null
                  val e = i.getStringExtra("act")
                  if (e != null) return e
                  return when (i.action) {
                      Intent.ACTION_ASSIST, Intent.ACTION_VOICE_COMMAND, Intent.ACTION_SEARCH_LONG_PRESS, "android.speech.action.WEB_SEARCH" -> "voice"
                      else -> null
                  }
              }

              override fun onResume() {
                  super.onResume()
                  foreground = true
              }

              override fun onPause() {
                  foreground = false
                  super.onPause()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  web.setBackgroundColor(Color.BLACK)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          val a = pendingAct
                          if (a != null) {
                              pendingAct = null
                              web.postDelayed({ fireAct(a) }, 900)
                          }
                      }
                  }
                  web.webChromeClient = WebChromeClient()
                  web.addJavascriptInterface(Bridge(), "Android")
                  setContentView(web)
                  web.requestFocus()
                  instance = this
                  pendingAct = actFrom(intent)
                  web.loadUrl("file:///android_asset/index.html")

                  // Para poder leer el nombre del Wi-Fi
                  if (Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), 1)
                  }
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  val a = actFrom(intent)
                  if (a != null) {
                      fireAct(a)
                  } else {
                      // Se pulsó el botón Home estando ya dentro del launcher
                      web.evaluateJavascript("window.onHome&&window.onHome()", null)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  web.evaluateJavascript("window.onBack&&window.onBack()", null)
              }

                  // ---------- botones del control remoto (YouTube, Netflix, Prime, Disney+) ----------

              private var swallowUp = -1

              private fun launchPkg(pkg: String): Boolean {
                  val pm = packageManager
                  val i = pm.getLeanbackLaunchIntentForPackage(pkg) ?: pm.getLaunchIntentForPackage(pkg) ?: return false
                  startSafe(i)
                  return true
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  // algunos botones llegan como "desconocidos": se identifican por su scanCode
                  val code = if (event.keyCode == KeyEvent.KEYCODE_UNKNOWN) 100000 + event.scanCode else event.keyCode
                  if (event.action == KeyEvent.ACTION_UP && code == swallowUp) {
                      swallowUp = -1
                      return true
                  }
                  if (event.action == KeyEvent.ACTION_DOWN && !isNavKey(code)) {
                      val act = actForKey(code)
                      if (act != null) {
                          swallowUp = code
                          if (event.repeatCount == 0) fireAct(act)
                          return true
                      }
                      if (learning) {
                          learning = false
                          swallowUp = code
                          web.post { web.evaluateJavascript("window.onLearn&&window.onLearn(" + code + ")", null) }
                          return true
                      }
                      val pkg = keyMap[code]
                      if (pkg != null) {
                          swallowUp = code
                          if (event.repeatCount == 0) launchPkg(pkg)
                          return true
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }

              // ---------- voz (buscar por voz y recordatorios) ----------

              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var ttsPending: Pair<String, String>? = null

              private fun voiceEvent(kind: String, text: String) {
                  val code = "window.onVoice&&window.onVoice('" + kind + "'," + JSONObject.quote(text) + ")"
                  web.post { web.evaluateJavascript(code, null) }
              }

              private fun destroyRecognizer() {
                  try { recognizer?.cancel() } catch (e: Exception) { }
                  try { recognizer?.destroy() } catch (e: Exception) { }
                  recognizer = null
              }

              private fun beginVoice(lang: String) {
                  destroyRecognizer()
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      voiceEvent("error", "unavail")
                      return
                  }
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                      override fun onError(error: Int) {
                          val c = when (error) {
                              SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> "perm"
                              SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> "7"
                              else -> "x"
                          }
                          voiceEvent("error", c)
                      }
                      override fun onResults(results: Bundle?) {
                          val l = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          voiceEvent("final", if (l != null && l.isNotEmpty()) l[0] else "")
                      }
                      override fun onPartialResults(partialResults: Bundle?) {
                          val l = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (l != null && l.isNotEmpty()) voiceEvent("partial", l[0])
                      }
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang)
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                  r.startListening(i)
              }

              private fun sayNow(text: String, lang: String) {
                  val t = tts ?: return
                  try {
                      val l = Locale.forLanguageTag(lang)
                      if (t.isLanguageAvailable(l) >= TextToSpeech.LANG_AVAILABLE) t.language = l
                  } catch (e: Exception) {
                  }
                  t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "tvl")
              }

              override fun onDestroy() {
                  if (instance === this) instance = null
                  destroyRecognizer()
                  try { tts?.shutdown() } catch (e: Exception) { }
                  super.onDestroy()
              }

              // ---------- ayudas ----------


              private fun hasNotifAccess(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: return false
                  return s.contains(packageName)
              }

              private fun controller(): MediaController? {
                  return try {
                      val msm = getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val list = msm.getActiveSessions(ComponentName(this, MediaListener::class.java))
                      list.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING } ?: list.firstOrNull()
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun toDataUrl(bm: Bitmap, png: Boolean): String {
                  val bos = ByteArrayOutputStream()
                  if (png) bm.compress(Bitmap.CompressFormat.PNG, 100, bos)
                  else bm.compress(Bitmap.CompressFormat.JPEG, 85, bos)
                  val mime = if (png) "image/png" else "image/jpeg"
                  return "data:" + mime + ";base64," + Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP)
              }

              private fun startSafe(i: Intent) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  runOnUiThread {
                      try {
                          startActivity(i)
                      } catch (e: Exception) {
                      }
                  }
              }

              // ---------- puente JavaScript <-> Android ----------

              inner class Bridge {

                  @JavascriptInterface
                  fun apps(): String {
                      val pm = packageManager
                      val out = LinkedHashMap<String, String>()
                      for (cat in listOf(Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER)) {
                          val i = Intent(Intent.ACTION_MAIN).addCategory(cat)
                          for (ri in pm.queryIntentActivities(i, 0)) {
                              val p = ri.activityInfo.packageName
                              if (p == packageName) continue
                              if (!out.containsKey(p)) out[p] = ri.loadLabel(pm).toString()
                          }
                      }
                      val arr = JSONArray()
                      for ((p, l) in out) {
                          arr.put(JSONObject().put("pkg", p).put("label", l))
                      }
                      return arr.toString()
                  }

                  @JavascriptInterface
                  fun icon(pkg: String): String {
                      return try {
                          val pm = packageManager
                          var d: Drawable? = null
                          try {
                              val li = pm.getLeanbackLaunchIntentForPackage(pkg)
                              if (li != null) d = pm.getActivityBanner(li)
                          } catch (e: Exception) {
                          }
                          if (d == null) {
                              try {
                                  d = pm.getApplicationBanner(pkg)
                              } catch (e: Exception) {
                              }
                          }
                          val banner = d != null
                          val drawable: Drawable = d ?: pm.getApplicationIcon(pkg)
                          val w = if (banner) 320 else 192
                          val h = if (banner) 180 else 192
                          val bm = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                          val c = Canvas(bm)
                          drawable.setBounds(0, 0, w, h)
                          drawable.draw(c)
                          JSONObject().put("banner", banner).put("data", toDataUrl(bm, true)).toString()
                      } catch (e: Exception) {
                          "{}"
                      }
                  }

                  @JavascriptInterface
                  fun launch(pkg: String): Boolean {
                      val pm = packageManager
                      val i = pm.getLeanbackLaunchIntentForPackage(pkg) ?: pm.getLaunchIntentForPackage(pkg) ?: return false
                      startSafe(i)
                      return true
                  }

                  @JavascriptInterface
                  fun settings(kind: String) {
                      if (kind == "search") {
                          val i = pkgIntent("com.google.android.katniss") ?: Intent(Intent.ACTION_ASSIST)
                          startSafe(i)
                          return
                      }
                      val action = when (kind) {
                          "wifi" -> Settings.ACTION_WIFI_SETTINGS
                          "sound" -> Settings.ACTION_SOUND_SETTINGS
                          "display" -> Settings.ACTION_DISPLAY_SETTINGS
                          "access" -> Settings.ACTION_ACCESSIBILITY_SETTINGS
                          "notif" -> "android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"
                          else -> Settings.ACTION_SETTINGS
                      }
                      val i = Intent(action)
                      if (i.resolveActivity(packageManager) != null) {
                          startSafe(i)
                      } else {
                          startSafe(pkgIntent("com.android.tv.settings") ?: Intent(Settings.ACTION_SETTINGS))
                      }
                  }

                  private fun pkgIntent(pkg: String): Intent? {
                      val pm = packageManager
                      return pm.getLeanbackLaunchIntentForPackage(pkg) ?: pm.getLaunchIntentForPackage(pkg)
                  }

                  // Menú al mantener presionado una app: "Información de la app"
                  @JavascriptInterface
                  fun appInfo(pkg: String) {
                      startSafe(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + pkg)))
                  }

                  // Menú al mantener presionado una app: "Launcher predeterminado"
                  @JavascriptInterface
                  fun setDefaultLauncher() {
                      runOnUiThread {
                          try {
                              if (Build.VERSION.SDK_INT >= 29) {
                                  val rm = getSystemService(RoleManager::class.java)
                                  if (rm != null && rm.isRoleAvailable(RoleManager.ROLE_HOME) && !rm.isRoleHeld(RoleManager.ROLE_HOME)) {
                                      startActivityForResult(rm.createRequestRoleIntent(RoleManager.ROLE_HOME), 7)
                                      return@runOnUiThread
                                  }
                              }
                          } catch (e: Exception) {
                          }
                          val h = Intent(Settings.ACTION_HOME_SETTINGS)
                          if (h.resolveActivity(packageManager) != null) {
                              startSafe(h)
                          } else {
                              // Último recurso: Android muestra su selector de launcher
                              startSafe(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME))
                          }
                      }
                  }

                          @JavascriptInterface
                  fun setKeys(json: String) {
                      try {
                          val o = JSONObject(json)
                          val m = HashMap<Int, String>()
                          val ks = o.keys()
                          while (ks.hasNext()) {
                              val k = ks.next()
                              m[k.toInt()] = o.getString(k)
                          }
                          keyMap = m
                      } catch (e: Exception) {
                      }
                  }

                  @JavascriptInterface
                  fun keySvc(): Boolean {
                      val s = Settings.Secure.getString(contentResolver, "enabled_accessibility_services") ?: return false
                      return s.contains(packageName) && s.contains("KeyService")
                  }

                  @JavascriptInterface
                  fun learn(on: Boolean) {
                      learning = on
                  }

                  @JavascriptInterface
                  fun startVoice(lang: String) {
                      runOnUiThread {
                          try {
                              if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 2)
                                  voiceEvent("error", "perm")
                              } else {
                                  beginVoice(lang)
                              }
                          } catch (e: Exception) {
                              voiceEvent("error", "unavail")
                          }
                      }
                  }

                  @JavascriptInterface
                  fun stopVoice() {
                      runOnUiThread { destroyRecognizer() }
                  }

                  @JavascriptInterface
                  fun speak(text: String, lang: String) {
                      runOnUiThread {
                          try {
                              if (tts == null) {
                                  ttsPending = Pair(text, lang)
                                  tts = TextToSpeech(this@MainActivity, TextToSpeech.OnInitListener { st ->
                                      if (st == TextToSpeech.SUCCESS) {
                                          ttsReady = true
                                          val p = ttsPending
                                          ttsPending = null
                                          if (p != null) sayNow(p.first, p.second)
                                      }
                                  })
                              } else if (ttsReady) {
                                  sayNow(text, lang)
                              } else {
                                  ttsPending = Pair(text, lang)
                              }
                          } catch (e: Exception) {
                          }
                      }
                  }

                  @JavascriptInterface
                  fun mediaQueue(): String {
                      val arr = JSONArray()
                      try {
                          val q = controller()?.queue
                          if (q != null) {
                              for (item in q) {
                                  val d = item.description
                                  arr.put(JSONObject().put("title", d.title?.toString() ?: "").put("artist", d.subtitle?.toString() ?: ""))
                                  if (arr.length() >= 8) break
                              }
                          }
                      } catch (e: Exception) {
                      }
                      return arr.toString()
                  }

                  @JavascriptInterface
                  fun info(): String {
                      val o = JSONObject()
                      try {
                          val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          val mi = ActivityManager.MemoryInfo()
                          am.getMemoryInfo(mi)
                          o.put("ramFree", String.format(Locale.US, "%.1f", mi.availMem / 1073741824.0))
                          val st = StatFs(Environment.getDataDirectory().path)
                          o.put("storageFree", String.format(Locale.US, "%.1f", st.availableBytes / 1073741824.0))
                      } catch (e: Exception) {
                      }
                      try {
                          val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          o.put("online", cm.activeNetworkInfo?.isConnected == true)
                          val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          var ssid = wm.connectionInfo?.ssid ?: ""
                          ssid = ssid.trim('"')
                          if (ssid == "<unknown ssid>") ssid = ""
                          o.put("ssid", ssid)
                      } catch (e: Exception) {
                      }
                      return o.toString()
                  }

                  @JavascriptInterface
                  fun media(): String {
                      val o = JSONObject()
                      val access = hasNotifAccess()
                      o.put("access", access)
                      o.put("active", false)
                      if (!access) return o.toString()
                      val c = controller() ?: return o.toString()
                      val md = c.metadata
                      val st = c.playbackState
                      val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: ""
                      if (title.isEmpty()) return o.toString()
                      val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST)
                          ?: md?.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST) ?: ""
                      val playing = st != null && st.state == PlaybackState.STATE_PLAYING
                      var pos = st?.position ?: 0L
                      if (playing && st != null) {
                          pos += ((SystemClock.elapsedRealtime() - st.lastPositionUpdateTime) * st.playbackSpeed).toLong()
                      }
                      val dur = md?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L
                      o.put("active", true)
                      o.put("title", title)
                      o.put("artist", artist)
                      o.put("playing", playing)
                      o.put("pos", pos)
                      o.put("dur", dur)
                      o.put("pkg", c.packageName)
                      o.put("artKey", title + "|" + artist)
                      return o.toString()
                  }

                  @JavascriptInterface
                  fun mediaArt(): String {
                      return try {
                          val md = controller()?.metadata ?: return ""
                          val bm = md.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART)
                              ?: md.getBitmap(MediaMetadata.METADATA_KEY_ART)
                              ?: md.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON)
                              ?: return ""
                          toDataUrl(Bitmap.createScaledBitmap(bm, 300, 300, true), false)
                      } catch (e: Exception) {
                          ""
                      }
                  }

                  @JavascriptInterface
                  fun mediaCmd(cmd: String) {
                      val c = controller() ?: return
                      val t = c.transportControls
                      when (cmd) {
                          "next" -> t.skipToNext()
                          "prev" -> t.skipToPrevious()
                          "toggle" -> {
                              if (c.playbackState?.state == PlaybackState.STATE_PLAYING) t.pause() else t.play()
                          }
                      }
                  }
              }
          }
          EOF_FILE
          cat > android/app/src/main/java/com/tvlauncher/MediaListener.kt <<'EOF_FILE'
          package com.tvlauncher

          import android.service.notification.NotificationListenerService

          // Solo existe para que Android nos deje leer qué música suena (permiso "acceso a notificaciones").
          class MediaListener : NotificationListenerService()
          EOF_FILE
          cat > android/app/src/main/java/com/tvlauncher/KeyService.kt <<'EOF_FILE'
          package com.tvlauncher

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          import android.view.accessibility.AccessibilityEvent

          // Atiende los botones del control en TODAS las apps: mic (asistente), tuerca (ajustes)
          // y los botones asignados (YouTube, Netflix...). Hay que activarlo en Ajustes > Accesibilidad.
          class KeyService : AccessibilityService() {

              private val h = Handler(Looper.getMainLooper())
              private var swallow = -1

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val code = if (event.keyCode == KeyEvent.KEYCODE_UNKNOWN) 100000 + event.scanCode else event.keyCode
                  if (event.action == KeyEvent.ACTION_UP) {
                      if (code == swallow) {
                          swallow = -1
                          return true
                      }
                      return false
                  }
                  if (event.action != KeyEvent.ACTION_DOWN) return false
                  if (MainActivity.isNavKey(code)) return false

                  if (MainActivity.learning) {
                      val a = MainActivity.instance
                      if (a != null) {
                          swallow = code
                          a.learnHit(code)
                          return true
                      }
                      return false
                  }

                  val act = MainActivity.actForKey(code)
                  if (act != null) {
                      swallow = code
                      if (event.repeatCount == 0) goAct(act)
                      return true
                  }

                  val pkg = MainActivity.keyMap[code]
                  if (pkg != null) {
                      swallow = code
                      if (event.repeatCount == 0) launchPkg(pkg)
                      return true
                  }
                  return false
              }

              private fun goAct(act: String) {
                  val a = MainActivity.instance
                  if (MainActivity.foreground && a != null) {
                      a.fireAct(act)
                      return
                  }
                  try {
                      val i = Intent(this, MainActivity::class.java)
                      i.putExtra("act", act)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      startActivity(i)
                  } catch (e: Exception) {
                  }
                  // si Android no dejó abrirlo, se manda a Inicio (que es este launcher)
                  h.postDelayed({
                      if (!MainActivity.foreground) performGlobalAction(GLOBAL_ACTION_HOME)
                  }, 450)
              }

              private fun launchPkg(pkg: String) {
                  try {
                      val i = packageManager.getLeanbackLaunchIntentForPackage(pkg) ?: packageManager.getLaunchIntentForPackage(pkg) ?: return
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                  } catch (e: Exception) {
                  }
              }
          }
          EOF_FILE
          cat > android/app/src/main/res/xml/key_service.xml <<'EOF_FILE'
